<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSim — My Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="wide">
    <h1>My Portfolio</h1>
    <p class="page-sub">Your current holdings and cash balance.</p>

    <div id="portfolio-content">
      <div class="two-col">
        <div class="stat-box">
          <div class="stat-label">Cash Balance</div>
          <div class="stat-value" id="cash-value">$0.00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Holdings Value</div>
          <div class="stat-value" id="holdings-value">$0.00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Total Value</div>
          <div class="stat-value" id="total-value">$0.00</div>
        </div>
      </div>

      <div class="table-scroll" style="margin-top: 20px;">
        <table class="stocks" id="holdings-table">
          <thead>
            <tr>
              <th>Ticker</th>
              <th>Company</th>
              <th>Shares Owned</th>
              <th>Current Price</th>
              <th>Market Value</th>
            </tr>
          </thead>
          <tbody id="holdings-body">
            <tr><td colspan="5">Loading portfolio…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script>
    renderNav("portfolio");

    if (requireLogin()) {
      function formatMoney(n) {
        return "$" + n.toFixed(2);
      }

      function render() {
        getPortfolioSummary().then(p => {
          document.getElementById("cash-value").textContent = formatMoney(p.cashBalance);
          document.getElementById("holdings-value").textContent = formatMoney(p.holdingsValue);
          document.getElementById("total-value").textContent = formatMoney(p.totalValue);

          const body = document.getElementById("holdings-body");
          if (p.holdings.length === 0) {
            body.innerHTML = `<tr><td colspan="5">You don't own any shares yet. Visit the Buy page to get started.</td></tr>`;
            return;
          }
          body.innerHTML = p.holdings.map(h => `
            <tr>
              <td><strong>${h.ticker}</strong></td>
              <td>${h.company}</td>
              <td>${h.quantity}</td>
              <td>${formatMoney(h.price)}</td>
              <td>${formatMoney(h.marketValue)}</td>
            </tr>
          `).join("");
        }).catch(err => {
          document.getElementById("holdings-body").innerHTML =
            `<tr><td colspan="5">Couldn't load portfolio: ${err.message}</td></tr>`;
        });
      }

      render();
      setInterval(render, 2000); // catches pending orders executing, and live price changes
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSim — Deposit / Withdraw Cash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main>
    <h1>Manage Cash</h1>
    <p class="page-sub">Deposit or withdraw from your cash account.</p>

    <div class="panel">

      <div class="est-box" id="balance-box">Current Cash Balance: —</div>

      <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-deposit">Deposit</button>
        <button type="button" class="tab-btn" id="tab-withdraw">Withdraw</button>
      </div>

      <label for="amount" id="amount-label">Deposit Amount ($)</label>
      <input type="number" id="amount" min="0.01" step="0.01">

      <div id="cash-msg" class="msg"></div>

      <button type="button" class="btn" id="submit-btn">Deposit</button>
    </div>
  </main>

  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script>
    renderNav("cash");

    if (requireLogin()) {
      let mode = "deposit"; // or "withdraw"
      const balanceBox = document.getElementById("balance-box");
      const tabDeposit = document.getElementById("tab-deposit");
      const tabWithdraw = document.getElementById("tab-withdraw");
      const amountLabel = document.getElementById("amount-label");
      const amountInput = document.getElementById("amount");
      const msgBox = document.getElementById("cash-msg");
      const submitBtn = document.getElementById("submit-btn");

      function showMsg(text, type) {
        msgBox.textContent = text;
        msgBox.className = `msg show ${type}`;
      }

      function refreshBalance() {
        getCashBalance().then(value => {
          balanceBox.textContent = "Current Cash Balance: " + (value === null ? "unavailable" : fmtMoney(value));
        });
      }

      function setMode(newMode) {
        mode = newMode;
        tabDeposit.classList.toggle("active", mode === "deposit");
        tabWithdraw.classList.toggle("active", mode === "withdraw");
        amountLabel.textContent = (mode === "deposit" ? "Deposit" : "Withdrawal") + " Amount ($)";
        submitBtn.textContent = mode === "deposit" ? "Deposit" : "Withdraw";
        msgBox.className = "msg";
        amountInput.value = "";
      }

      tabDeposit.addEventListener("click", () => setMode("deposit"));
      tabWithdraw.addEventListener("click", () => setMode("withdraw"));

      submitBtn.addEventListener("click", () => {
        submitBtn.disabled = true;
        msgBox.className = "msg";

        const action = mode === "deposit" ? depositCash(amountInput.value) : withdrawCash(amountInput.value);

        action.then(result => {
          submitBtn.disabled = false;
          if (result.success) {
            showMsg(
              (mode === "deposit" ? "Deposit" : "Withdrawal") + " successful. New balance: " + fmtMoney(result.newBalance),
              "success"
            );
            amountInput.value = "";
            refreshBalance();
          } else {
            showMsg(result.error, "error");
          }
        });
      });


      refreshBalance();
      setInterval(refreshBalance, 5000);
    }
  </script>
</body>
</html>

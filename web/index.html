<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSim — Available Stocks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="wide">
    <h1>Available Stocks</h1>
    <p class="page-sub">Live prices update from the price generator once it's connected. Showing sample data for now.</p>

    <div class="table-scroll">
      <table class="stocks" id="stocks-table">
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Company</th>
            <th>Price</th>
            <th>Change</th>
            <th>Volume</th>
            <th>Market Cap</th>
          </tr>
        </thead>
        <tbody id="stocks-body">
          <tr><td colspan="6">Loading stocks…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script>
    renderNav("listing");

    function formatMoney(n) {
      return "$" + n.toFixed(2);
    }

    function parseVolume(v) {
      const num = parseFloat(v);
      if (v.toUpperCase().includes("M")) return num * 1_000_000;
      if (v.toUpperCase().includes("K")) return num * 1_000;
      return num;
    }

    getStocks().then(stocks => {
      const body = document.getElementById("stocks-body");
      body.innerHTML = stocks.map(s => {
        const changeClass = s.change >= 0 ? "change-up" : "change-down";
        const changeSign = s.change >= 0 ? "+" : "";
        const marketCap = formatMoney((s.price * parseVolume(s.volume)) / 1_000_000) + "M";
        return `
          <tr>
            <td><strong>${s.ticker}</strong></td>
            <td>${s.company}</td>
            <td>${formatMoney(s.price)}</td>
            <td class="${changeClass}">${changeSign}${s.change}%</td>
            <td>${s.volume}</td>
            <td>${marketCap}</td>
          </tr>
        `;
      }).join("");
    }).catch(err => {
      document.getElementById("stocks-body").innerHTML =
        `<tr><td colspan="6">Couldn't load stocks: ${err.message}</td></tr>`;
    });
  </script>
</body>
</html>

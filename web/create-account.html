<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSim — Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main>
    <h1>Create Your Account</h1>
    <p class="page-sub">Sign up to start trading with simulated cash.</p>

    <div class="panel">
      <form id="account-form">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required>

        <label for="username">Username</label>
        <input type="text" id="username" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" minlength="8" required>

        <div id="account-msg" class="msg"></div>

        <button type="submit" class="btn" id="submit-btn">Create Account</button>
      </form>
    </div>
  </main>

  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script>
    renderNav("account");

    const form = document.getElementById("account-form");
    const msgBox = document.getElementById("account-msg");
    const submitBtn = document.getElementById("submit-btn");

    function showMsg(text, type) {
      msgBox.textContent = text;
      msgBox.className = `msg show ${type}`;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating…";
      msgBox.className = "msg";

      createAccount({ fullName, username, email, password }).then(result => {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";

        if (result.success) {
          showMsg("Account created! You can now log in.", "success");
          form.reset();
        } else {
          showMsg(result.error, "error");
        }
      });
    });
  </script>
</body>
</html>

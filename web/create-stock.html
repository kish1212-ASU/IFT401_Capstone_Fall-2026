<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSim — Create New Stock (Admin)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main>
    <h1>Create New Stock</h1>
    <p class="page-sub">Admin only — adds a new tradable stock to the system.</p>

    <div class="panel">
      <form id="stock-form">
        <label for="companyName">Company Name</label>
        <input type="text" id="companyName" required>

        <label for="ticker">Stock Ticker Symbol</label>
        <input type="text" id="ticker" maxlength="6" required>

        <label for="volume">Volume (Total Shares Issued)</label>
        <input type="number" id="volume" min="1" required>

        <label for="initialPrice">Initial Price ($)</label>
        <input type="number" id="initialPrice" min="0.01" step="0.01" required>

        <div id="stock-msg" class="msg"></div>

        <button type="submit" class="btn" id="submit-btn">Create Stock</button>
      </form>
    </div>
  </main>

  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script>
    renderNav("admin");

    if (requireAdmin()) {
    const form = document.getElementById("stock-form");
    const msgBox = document.getElementById("stock-msg");
    const submitBtn = document.getElementById("submit-btn");

    function showMsg(text, type) {
      msgBox.textContent = text;
      msgBox.className = `msg show ${type}`;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const companyName = document.getElementById("companyName").value.trim();
      const ticker = document.getElementById("ticker").value.trim();
      const volume = document.getElementById("volume").value;
      const initialPrice = document.getElementById("initialPrice").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating…";
      msgBox.className = "msg";

      createStock({ companyName, ticker, volume, initialPrice }).then(result => {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Stock";

        if (result.success) {
          showMsg(`${ticker.toUpperCase()} was created successfully.`, "success");
          form.reset();
        } else {
          showMsg(result.error, "error");
        }
      });
    });
    } // end requireAdmin()
  </script>
</body>
</html>

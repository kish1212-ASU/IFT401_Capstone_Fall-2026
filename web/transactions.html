<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSim — Transaction History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="wide">
    <h1>Transaction History</h1>
    <p class="page-sub">Every buy, sell, deposit, and withdrawal on your account, newest first.</p>

    <div class="table-scroll">
      <table class="stocks" id="tx-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Ticker</th>
            <th>Quantity</th>
            <th>Price/Share</th>
            <th>Total</th>
            <th>Balance After</th>
          </tr>
        </thead>
        <tbody id="tx-body">
          <tr><td colspan="7">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script>
    renderNav("transactions");

    if (requireLogin()) {
      function render() {
        getTransactionHistory().then(res => {
          const body = document.getElementById("tx-body");
          if (!res.success) {
            body.innerHTML = `<tr><td colspan="7">Couldn't load history: ${escapeHtml(res.error)}</td></tr>`;
            return;
          }

          if (res.rows.length === 0) {
            body.innerHTML = `<tr><td colspan="7">No transactions yet. Deposit cash or place an order to get started.</td></tr>`;
            return;
          }

          // Cash transactions have no ticker, quantity or price per share.
          body.innerHTML = res.rows.map(r => `
            <tr>
              <td>${new Date(r.date).toLocaleString()}</td>
              <td>${escapeHtml(r.type.toUpperCase())}</td>
              <td>${r.ticker ? escapeHtml(r.ticker) : "—"}</td>
              <td>${r.quantity ?? "—"}</td>
              <td>${fmtMoney(r.pricePerShare)}</td>
              <td>${fmtMoney(r.total)}</td>
              <td>${fmtMoney(r.balanceAfter)}</td>
            </tr>
          `).join("");
        });
      }

      render();
      setInterval(render, 3000); // picks up orders as they fill
    }
  </script>
</body>
</html>

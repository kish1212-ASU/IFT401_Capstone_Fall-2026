<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSim — Transaction History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main class="wide">
    <h1>Transaction History</h1>
    <p class="page-sub" id="history-sub">Your account activity, newest first.</p>

    <div class="table-scroll">
      <table class="stocks" id="tx-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Ticker</th>
            <th>Quantity</th>
            <th>Price/Share</th>
            <th>Total</th>
            <th>Balance After</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tx-body">
          <tr><td colspan="8">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script>
    renderNav("transactions");

    if (requireLogin()) {
      function statusCell(row) {
        if (!row.status) return "—";
        if (row.status === "rejected") {
          return `<span class="change-down">rejected: ${escapeHtml(row.note || "unknown reason")}</span>`;
        }
        if (row.status === "executed") return `<span class="change-up">executed</span>`;
        return escapeHtml(row.status);
      }

      function render() {
        getTransactionHistory().then(res => {
          const body = document.getElementById("tx-body");
          if (!res.success) {
            body.innerHTML = `<tr><td colspan="8">Couldn't load history: ${escapeHtml(res.error)}</td></tr>`;
            return;
          }

          document.getElementById("history-sub").textContent = res.source === "orders"
            ? "Every order you've placed, newest first. Deposits and withdrawals will appear here once the server tracks them."
            : "Every buy, sell, deposit, and withdrawal on your account, newest first.";

          if (res.rows.length === 0) {
            body.innerHTML = `<tr><td colspan="8">Nothing here yet. Place an order on the Buy page first.</td></tr>`;
            return;
          }

          body.innerHTML = res.rows.map(r => `
            <tr>
              <td>${new Date(r.date).toLocaleString()}</td>
              <td>${escapeHtml(r.type.toUpperCase())}</td>
              <td>${r.ticker ? escapeHtml(r.ticker) : "—"}</td>
              <td>${r.quantity ?? "—"}</td>
              <td>${fmtMoney(r.pricePerShare)}</td>
              <td>${fmtMoney(r.total)}</td>
              <td>${fmtMoney(r.balanceAfter)}</td>
              <td>${statusCell(r)}</td>
            </tr>
          `).join("");
        });
      }

      render();
      setInterval(render, 3000); // picks up orders as they fill
    }
  </script>
</body>
</html>

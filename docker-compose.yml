services:
  db:
    image: postgres:16
    container_name: stocktrader-db
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: stocktrader
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d stocktrader"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
